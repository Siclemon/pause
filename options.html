<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>options</title>
    <link rel="stylesheet" href="style.css">
    <script src="./options.js" defer></script>
</head>

<body>
    <main class="opt__main">
        <h1>Options</h1>
        <nav>
            <a href="./index.html" id="back">retour</a>
        </nav>

        <form action="">
            <fieldset>
                <legend>Emploi du temps</legend>
                <fieldset>
                    <legend>Sport</legend>
                    <label for="sp_mon">Lundi
                        <input type="checkbox" name="sch_sp_mon" id="sp_mon" value="true">
                    </label>
                    <label for="sp_wed">Mercredi
                        <input type="checkbox" name="sch_sp_wed" id="sp_wed" value="true">
                    </label>
                </fieldset>
                <fieldset>
                    <legend>Anglais 1</legend>
                    <label for="en_n_1">
                        Groupe 1
                        <input type="radio" name="sch_en_n" value="1" id="en_n_1">
                    </label>
                    <label for="en_n_2">
                        Groupe 2
                        <input type="radio" name="sch_en_n" value="2" id="en_n_2">
                    </label>
                    <label for="en_n_0">
                        Pas concerné·e
                        <input type="radio" name="sch_en_n" value="0" id="en_n_0">
                    </label>
                </fieldset>
                <fieldset>
                    <legend>Anglais 2</legend>
                    <label for="en_c_1">
                        Groupe 1
                        <input type="radio" name="sch_en_c" value="1" id="en_c_1">
                    </label>
                    <label for="en_c_2">
                        Groupe 2
                        <input type="radio" name="sch_en_c" value="2" id="en_c_2">
                    </label>
                </fieldset>
                <fieldset>
                    <legend>Autre</legend>
                    <label for="oth_16">
                        Horaire aménagé (16h)
                        <input type="checkbox" name="sch_oth_16" id="oth_16" value="true">
                    </label>
                </fieldset>
            </fieldset>
            <fieldset>
                <legend>Affichage</legend>
                <label for="break_name">
                    Afficher le nom du timer
                    <input type="checkbox" name="dis_break_name" id="break_name" value="true">
                </label>
                <label for="color" class="not_working">
                    Interface colorée
                    <input type="checkbox" name="dis_color" id="color" value="true" checked>
                </label>
                <label for="blinking">
                    Clignotement
                    <input type="checkbox" name="dis_blinking" id="blinking" value="true" checked>
                </label>
                <label for="milliseconds" class="not_working">
                    Afficher les millisecondes
                    <input type="checkbox" name="dis_milliseconds" id="milliseconds" value="true">
                </label>
            </fieldset>
            <fieldset>
                <legend>Général</legend>
                <fieldset>
                    <legend>Timer</legend>
                    <label for="timer_all">
                        Tout compter
                        <input type="radio" name="gen_timer" id="timer_all" value="all" checked>
                    </label>
                    <label for="timer_brk">
                        Seulement compter les pauses
                        <input type="radio" name="gen_timer" id="timer_brk" value="brk">
                    </label>
                    <label for="timer_end">
                        Seulement compter la fin de journée
                        <input type="radio" name="gen_timer" id="timer_end" value="end">
                    </label>
                </fieldset>
                <label for="holidays" class="not_working">
                    Décompte vacances
                    <input type="checkbox" name="gen_holidays" id="holidays" value="true">
                </label>
            </fieldset>


            <div class="form__buttons">
                <button type="button" id="resetForm">Reset</button>
                <button type="button" id="ok">Valider</button>
            </div>
        </form>
    </main>
</body>

</html>
